name: Build Saelin Shine

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Zip VST3
        run: cd build/SaelinShine_artefacts/Release/VST3 && zip -r ../../../../SaelinShine-macOS-VST3.zip "Saelin Shine.vst3"

      - name: Zip AU
        run: cd build/SaelinShine_artefacts/Release/AU && zip -r ../../../../SaelinShine-macOS-AU.zip "Saelin Shine.component"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SaelinShine-macOS-VST3
          path: SaelinShine-macOS-VST3.zip

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: SaelinShine-macOS-AU
          path: SaelinShine-macOS-AU.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SaelinShine-Windows-VST3
          path: build/SaelinShine_artefacts/Release/VST3/Saelin Shine.vst3
